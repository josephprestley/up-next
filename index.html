<style>
/* Layout: a listings-guide app in a dark screening room: a lit "tonight" header (the projector beam), a sticky channel bar
   of tabs, then one working view at a time; show and episode detail open in a sheet. Posters are the viewer's own photos
   or flat tiles in each show's signature color. Up Next commits to one dark look in every theme. */
:root[data-app="upnext"], :root[data-app="upnext"][data-theme="light"], :root[data-app="upnext"][data-theme="dark"] {
  --bg: #0f0e13; --surface: #19171f; --sunk: #131118; --ink: #f1ede6; --muted: #a59fae; --line: #2c2934; --line-strong: #423d4b;
  --falu: #f0b03f; --falu-soft: #3a2c12; --honey: #f0b03f; --honey-soft: #3a2c12; --honey-ink: #ffd99a;
  --moss: #82cf93; --moss-soft: #1b3122; --fjord: #9fc0ea; --fjord-soft: #1a2633; --berry: #ff8f82; --berry-soft: #3d1d1a;
  --accent: #f0b03f; --accent-soft: #33280f; --on-accent: #1b1406;
  --beam: #f0b03f;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 18px 40px -22px #000;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root[data-app="upnext"]:not([data-theme="light"]) { color-scheme: dark; } }
:root {
  /* page names mapped onto the tokens above */
  --accent-ink: var(--on-accent);
  --good: var(--moss); --good-soft: var(--moss-soft);
  --star: var(--honey); --danger: var(--berry);
  --scrim: rgba(4, 3, 8, .66);
  --f-display: var(--display); --f-body: var(--body); --f-mono: var(--body);

  /* test-card poster colors: poster art, identical in both themes */
  --tc-0: #E8C22E; --tc-0-fg: #1A1606;
  --tc-1: #29A9BD; --tc-1-fg: #03171B;
  --tc-2: #3A9A57; --tc-2-fg: #F2FFF6;
  --tc-3: #B8408F; --tc-3-fg: #FFF2FA;
  --tc-4: #CF4436; --tc-4-fg: #FFF4F2;
  --tc-5: #3150BF; --tc-5-fg: #F1F4FF;
  --tc-6: #C9CED6; --tc-6-fg: #14181F;
  --photo-fg: #FFFFFF;
}

* { box-sizing: border-box; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button[disabled] { cursor: default; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
/* codes, counts and dates: Figtree with even figures (gb.css has no mono face) */
.tab .badge, .poster-net, .next-code, .up-item .e b, .up-item .net, .chip .n, .rw-badge, .section-label .count, .tbar .v, .hist-row .d, .season-count, .ep-code, .ep-date, .ep-hero .code, .next-up .what b { font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* header */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar-in, .main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { display: flex; gap: 3px; align-items: center; }
.brand-mark i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--honey); box-shadow: 0 0 6px var(--honey); }
.brand-name { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.1; color: var(--falu); }
.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tab {
  border: 0; background: transparent; padding: 8px 13px; border-radius: 999px;
  font-weight: 600; color: var(--muted); white-space: nowrap; position: relative;
}
.tab:hover { color: var(--ink); background: var(--sunk); }
.tab[aria-current="page"] { background: var(--falu); color: var(--on-accent); }
.tab .badge { font-family: var(--f-mono); font-size: 11px; margin-left: 4px; opacity: .75; }
@media (max-width: 640px) {
  .tabs { margin-left: 0; width: 100%; }
  .tab { flex: 1; padding: 8px 4px; font-size: 13px; }
  .tab .badge { display: none; }
}

.main { padding-block: 28px 64px; display: grid; gap: 28px; }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-title { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 36px); line-height: 1.08; }
.view-sub { color: var(--muted); margin: 6px 0 0; }
.section-label {
  font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.section-label .count { font-family: var(--f-mono); letter-spacing: 0; }
.stack { display: grid; gap: 12px; }

/* posters */
.poster {
  position: relative; display: flex; flex-direction: column; justify-content: flex-end;
  background: var(--pbg); color: var(--pfg); border-radius: var(--r-sm); overflow: hidden;
  aspect-ratio: 2 / 3; max-width: 100%; padding: 10px; isolation: isolate; flex: none; border-radius: 8px;
}
.poster::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 7px; z-index: 1;
  background: linear-gradient(90deg, var(--tc-0) 0 16.6%, var(--tc-1) 0 33.3%, var(--tc-2) 0 50%, var(--tc-3) 0 66.6%, var(--tc-4) 0 83.3%, var(--tc-5) 0);
  opacity: .9;
}
.poster::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.05) 3px 4px);
}
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.poster.has-photo { color: var(--photo-fg); background: #222; }
.poster.has-photo::before, .poster.branded::before { display: none; }
.poster.has-photo::after { background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.72)); }
.poster-net { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .85; margin-bottom: 4px; }
.poster-title { font-family: var(--display); font-weight: 400; line-height: 1.04; font-size: 18px; overflow-wrap: break-word; }
.poster-mono { font-family: var(--display); font-weight: 400; text-transform: uppercase; line-height: 1; }
.poster-xs { width: 52px; padding: 6px; border-radius: 4px; }
.poster-xs .poster-net, .poster-xs .poster-title { display: none; }
.poster-xs::before { height: 4px; }
.poster-xs.has-photo .poster-mono { display: none; }
.poster-lg { width: 120px; }
.poster-lg .poster-title { font-size: 17px; }
.poster-md .poster-mono, .poster-lg .poster-mono { display: none; }
.up-item .poster-xs, .hist-row .poster-xs { width: 40px; padding: 5px; }

/* up next cards */
.next-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.next-card {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px;
}
.next-open {
  all: unset; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px;
  align-items: center; min-width: 0; text-align: left;
}
.next-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.next-body { min-width: 0; display: grid; gap: 1px; }
.next-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-code { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-code span { font-family: var(--f-body); font-weight: 500; color: var(--ink); }
.next-meta { font-size: 13px; color: var(--muted); }
.meter { height: 4px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.meter.done i { background: var(--good); }
.check-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; color: var(--muted); transition: border-color .15s, color .15s, background .15s; flex: none;
}
.check-btn:hover:not([disabled]) { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.check-btn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--bg); }
.check-btn.rw[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check-btn.rw:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.check-btn[disabled] { opacity: .45; }
.check-btn svg { width: 20px; height: 20px; }
.check-btn.sm { width: 32px; height: 32px; border-width: 1.5px; }
.check-btn.sm svg { width: 16px; height: 16px; }

.quiet-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; }
.quiet-item {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: transparent; border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 12px 8px 8px;
}
.quiet-item:hover { background: var(--surface); }
.quiet-item .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quiet-item .s { font-size: 13px; color: var(--muted); }
.quiet-item > div { min-width: 0; display: grid; }

/* upcoming */
.day { display: grid; grid-template-columns: minmax(128px, max-content) minmax(0, 1fr); gap: 16px; padding-block: 16px; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; padding-top: 0; }
.day-label { display: grid; align-content: start; }
.day-label b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.day-label span { font-size: 13px; color: var(--muted); display: block; white-space: nowrap; }
.day.is-today .day-label b { color: var(--accent); }
.day-items { display: grid; gap: 8px; min-width: 0; }
.up-item {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 12px 8px 8px; width: 100%;
}
.up-item:hover { border-color: var(--muted); }
.up-item > div { min-width: 0; display: grid; }
.up-item .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-item .e { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-item .e b { font-family: var(--f-mono); font-weight: 600; color: var(--accent); margin-right: 6px; }
.up-item .net { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; }
@media (max-width: 480px) { .day { grid-template-columns: 1fr; gap: 8px; } .day-label { display: flex; gap: 10px; align-items: baseline; } .day-label b { font-size: 21px; } }

/* empty states */
.empty {
  border: 1.5px dashed var(--line); border-radius: var(--r-md); padding: 28px 20px;
  display: grid; gap: 10px; justify-items: start; background: var(--surface);
}
.empty h3 { font-size: 18px; }
.empty p { margin: 0; color: var(--muted); max-width: 56ch; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-sm); padding: 8px 14px; min-height: 38px;
  font-weight: 600; font-size: 14px; line-height: 1.2; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; max-width: 100%;
}
.btn:hover:not([disabled]) { border-color: var(--line-strong); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover:not([disabled]) { filter: brightness(1.08); border-color: var(--accent); }
.btn-good { background: var(--good); color: var(--bg); border-color: var(--good); }
.btn-good:hover:not([disabled]) { filter: brightness(1.06); border-color: var(--good); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fjord); }
.btn-ghost:hover:not([disabled]) { color: var(--ink); background: var(--sunk); border-color: transparent; }
.btn-danger { color: var(--danger); }
.btn-sm { padding: 5px 10px; font-size: 13px; min-height: 30px; border-radius: 10px; }
.btn[disabled] { opacity: .55; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn .ell { overflow: hidden; text-overflow: ellipsis; }

/* filter chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px;
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.chip .n { font-family: var(--f-mono); font-size: 12px; margin-left: 4px; opacity: .8; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }

/* poster grid */
.poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px 14px; }
@media (max-width: 420px) { .poster-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { all: unset; cursor: pointer; display: grid; gap: 8px; min-width: 0; align-content: start; }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: var(--r-sm); }
.tile:hover .poster { transform: translateY(-2px); }
.tile .poster { transition: transform .18s ease; }
.tile-cap { display: grid; gap: 2px; min-width: 0; }
.tile-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-sub { font-size: 12px; color: var(--muted); }
.tile-fav { position: absolute; top: 12px; right: 8px; font-size: 14px; color: var(--star); text-shadow: 0 1px 2px rgba(0,0,0,.4); }

.pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px;
  background: var(--sunk); color: var(--muted); width: fit-content;
}
.pill.watching, .pill.rewatching { background: var(--accent-soft); color: var(--accent); }
.pill.finished, .pill.caughtup { background: var(--good-soft); color: var(--good); }
.tag { font-family: var(--f-body); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 99px; padding: 1px 7px; margin-right: 6px; vertical-align: 1px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.rw { background: var(--accent-soft); color: var(--accent); }
.rw-badge { font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--accent); margin-left: 4px; white-space: nowrap; }

/* discover */
.search {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 6px 4px 16px; max-width: 560px;
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; outline: none; font-size: 16px; }
.result-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 8px; }
.result {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px 10px 10px;
}
.result .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result .m { font-size: 13px; color: var(--muted); }
.result > div { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; display: grid; gap: 14px; }
.panel h3 { font-size: 17px; }
.panel p { margin: 0; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note a { color: inherit; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, textarea, select.inline {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); padding: 9px 11px;
}
select.inline { width: auto; padding: 6px 10px; font-size: 14px; }
.field input:focus, .field select:focus, textarea:focus, select.inline:focus { border-color: var(--accent); outline: none; }
.field .hint { font-size: 12px; color: var(--muted); }
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* stats */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; display: grid; gap: 2px; }
.stat-num { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-num small { font-size: 22px; font-weight: 700; margin: 0 6px 0 2px; color: var(--muted); }
.stat-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.time-bars { display: grid; gap: 10px; }
.tbar { display: grid; grid-template-columns: minmax(0, 180px) minmax(0, 1fr) 72px; gap: 12px; align-items: center; }
.tbar .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbar .track { height: 12px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.tbar .track i { display: block; height: 100%; background: var(--pbg); border-radius: 3px; }
.tbar .v { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; }
@media (max-width: 480px) { .tbar { grid-template-columns: minmax(0, 110px) minmax(0, 1fr) 60px; } }
.history { display: grid; gap: 0; }
.hist-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.hist-row:first-child { border-top: 0; }
.hist-row > div { min-width: 0; display: grid; }
.hist-row .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-row .e { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    if (keepSearch) { const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(keepSearch[0], keepSearch[1]); } catch (e) {} } }
    else restoreFocus(sel, v);
    renderSheet();
    tvEnsureFocus(tvPrev);
  }

  // ---------- Views ----------
  let LAKE_ST = null;
  if (window.lake) window.lake.on("state", (st) => { LAKE_ST = st; if (store.mode !== "starting") render(); });
  // ---------- The screen: what's new tonight and what's next, from your own list (works on the Fire TV too) ----------
  // The dashboard's state adds how today's list is going (st.day), as before; outside Home Base the Fire TV reads the saved copy.
  function heroHTML(watching, leftMin) {
    const st = LAKE_ST, t = today();
    const todayOK = !!(st && st.date === t);
    const dayInfo = todayOK && st.day && st.day.loaded && st.day.total ? st.day : null;
    const cleared = !!(todayOK && st.marquee && st.marquee.lit);
    const up = upcomingList();
    const tonight = up.filter((it) => it.date === t);
    const later = up.filter((it) => it.date > t);
    // one row per show: its first new episode in the window
    const seen = new Set(), rows = [];
    // one show tonight is the title, so the list under it is what comes after
    const oneTonight = new Set(tonight.map((it) => it.s.id)).size === 1;
    (oneTonight ? later : tonight.concat(later)).forEach((it) => { if (rows.length >= 4 || seen.has(it.s.id)) return; seen.add(it.s.id); rows.push(it); });
    const now = new Date();
    const eyebrow = (tonight.length ? "Tonight · " : "Up next · ") + now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    let title, sub;
    if (tonight.length) {
      const names = [...new Set(tonight.map((it) => it.s.title))];
      title = names.length === 1 ? names[0] : plural(names.length, "new episode");
      sub = names.length === 1 ? shortCode(tonight[0].season, tonight[0].ep) + (tonight[0].title ? " · " + tonight[0].title : "") + " is out today." : names.join(", ") + " are out today.";
    } else if (watching.length) {
      title = plural(watching.length, "show") + " in progress";
      sub = fmtDur(leftMin) + " left to watch" + (later[0] ? ". Next new episode: " + later[0].s.title + ", " + fmtDate(later[0].date, true) + "." : ".");
    } else {
      title = "Up next";
      sub = later[0] ? "Next new episode: " + later[0].s.title + ", " + fmtDate(later[0].date, true) + "." : "The next episode of everything you’re watching.";
    }
    const note = dayInfo ? (cleared ? "Today’s list is done. <b>Enjoy the show.</b>" : "<b>" + esc(plural(Math.max(0, dayInfo.total - dayInfo.done), "card")) + "</b> left on today’s list. Watch anyway if you like.") : "";
    const when = (d) => { const n = daysUntil(d); return n === 0 ? "Tonight" : n === 1 ? "Tomorrow" : n < 7 ? parseYmd(d).toLocaleDateString(undefined, { weekday: "short" }) : fmtDate(d); };
    const lineup = rows.length
      ? rows.map((it) => '<li class="' + (it.date === t ? "is-tonight" : "") + '"><span class="when">' + esc(when(it.date)) + "</span><b>" + esc(it.s.title) + '</b><span class="code">' + esc(shortCode(it.season, it.ep)) + "</span></li>").join("")
      : '<li class="empty-line">' + (oneTonight ? "Nothing else announced yet." : "No new episodes announced for your shows.") + "</li>";
    return '<header class="un-hero"><div class="un-beam" aria-hidden="true"></div><div class="un-hero-txt"><p class="un-eyebrow">' + esc(eyebrow) + '</p><h1 class="un-title">' + esc(title) + "</h1>" +
      '<p class="un-sub">' + esc(sub) + "</p>" + (note ? '<p class="un-note">' + note + "</p>" : "") + '</div><ol class="un-lineup" aria-label="' + (oneTonight ? "Coming up after tonight" : "New episodes coming up") + '">' + lineup + "</ol></header>";
  }
  function viewNext() {
    const list = snapshotArray();
    const watching = list.filter((s) => { const st = stateOf(s); return (st === "watching" || st === "rewatching") && queueNext(s); }).sort((a, b) => (b.lastWatchedAt || 0) - (a.lastWatchedAt || 0));
    const notStarted = list.filter((s) => stateOf(s) === "notstarted").sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
    const caught = list.filter((s) => stateOf(s) === "caughtup");
    const leftMin = watching.reduce((a, s) => a + leftMinutes(s), 0);

    let h = heroHTML(watching, leftMin);

    if (!list.length) {
      return h + '<div class="empty"><h3>Nothing on your list yet</h3><p>Add the shows you watch and this page will always show the next episode of each one. Tap the check when you finish it.</p><button class="btn btn-primary" data-action="go" data-tab="discover">' + ICON.plus + "Add shows</button></div>";
    }

    if (watching.length) {
      h += '<div class="next-grid">' + watching.map((s) => {
        const q = queueNext(s), left = leftCount(s);
        return '<div class="next-card">' +
          '<button class="next-open" data-action="open-ep" data-id="' + esc(s.id) + '" data-s="' + q.season + '" data-e="' + q.ep + '">' + poster(s, "xs") +
          '<div class="next-body"><span class="next-title">' + (q.rewatch ? '<span class="tag rw">Rewatch</span>' : "") + esc(s.title) + '</span><span class="next-code">' + shortCode(q.season, q.ep) + " <span>" + esc(epTitle(s, q.season, q.ep)) + "</span></span>" +
          '<span class="next-meta">' + left + " left · " + fmtDur(leftMinutes(s)) + "</span>" + meter(s) + "</div></button>" +
          '<button class="check-btn' + (q.rewatch ? " rw" : "") + '" data-action="mark-next" data-id="' + esc(s.id) + '" aria-label="Mark ' + shortCode(q.season, q.ep) + " of " + esc(s.title) + (q.rewatch ? ' rewatched" title="Mark rewatched">' : ' watched" title="Mark watched">') + ICON.check + "</button></div>";
      }).join("") + "</div>";
    } else {
      h += '<div class="empty"><h3>No episodes waiting</h3><p>You’re caught up on everything that’s out. Start one of the shows below, or add something new.</p></div>';
    }

    if (notStarted.length) {
      h += '<div class="stack"><div class="section-label">Haven’t started <span class="count">' + notStarted.length + '</span></div><div class="quiet-list">' +
        notStarted.map((s) => '<button class="quiet-item" data-action="open" data-id="' + esc(s.id) + '">' + poster(s, "xs") + '<div><span class="t">' + esc(s.title) + '</span><span class="s">' + plural(airedRegular(s), "episode") + " · " + fmtDur(leftMinutes(s)) + "</span></div></button>").join("") +
        "</div></div>";
    }
    if (caught.length) {
      h += '<div class="stack"><div class="section-label">Caught up <span class="count">' + caught.length + '</span></div><div class="quiet-list">' +
        caught.map((s) => {
          const f = firstUnwatched(s), info = f && epInfo(s, f.season, f.ep);
          const sub = f && info.date ? shortCode(f.season, f.ep) + " out " + fmtDate(info.date, true) : "Waiting on new episodes";
          return '<button class="quiet-item" data-action="open" data-id="' + esc(s.id) + '">' + poster(s, "xs") + '<div><span class="t">' + esc(s.title) + '</span><span class="s">' + esc(sub) + "</span></div></button>";
        }).join("") + "</div></div>";
    }
    return h;
  }

  function viewUpcoming() {
    const items = upcomingList();
    let h = '<div class="view-head"><div><h1 class="view-title">Upcoming</h1><p class="view-sub">New episodes of shows on your list, by release date.</p></div></div>';
    if (!shows.size) return h + '<div class="empty"><h3>No shows yet</h3><p>Add shows and their upcoming episodes will be listed here by date.</p><button class="btn btn-primary" data-action="go" data-tab="discover">' + ICON.plus + "Add shows</button></div>";
    if (!items.length) {
      return h + '<div class="empty"><h3>Nothing scheduled</h3><p>None of your shows have announced episodes coming up. Release dates appear for shows from the Add list; shows you entered yourself don’t have dates.</p></div>';
    }
    const groups = new Map();
    items.forEach((it) => { if (!groups.has(it.date)) groups.set(it.date, []); groups.get(it.date).push(it); });
    h += '<div class="panel" style="gap:0">';
    groups.forEach((list, date) => {
      const n = daysUntil(date);
      const big = n === 0 ? "Today" : n === 1 ? "Tomorrow" : parseYmd(date).toLocaleDateString(undefined, { weekday: "short" });
      const small = n <= 1 ? "<span>" + esc(fmtDate(date, true)) + "</span>" : "<span>" + esc(fmtDate(date)) + "</span><span>in " + plural(n, "day") + "</span>";
      h += '<div class="day' + (n === 0 ? " is-today" : "") + '"><div class="day-label"><b>' + esc(big) + "</b>" + small + '</div><div class="day-items">' +
        list.map((it) => '<button class="up-item" data-action="open-ep" data-id="' + esc(it.s.id) + '" data-s="' + it.season + '" data-e="' + it.ep + '">' + poster(it.s, "xs") +
          '<div><span class="t">' + esc(it.s.title) + '</span><span class="e"><b>' + shortCode(it.season, it.ep) + "</b>" + esc(it.title || (it.season === 0 ? "Special" : "Episode " + it.ep)) + '</span></div><span class="net">' + esc(it.s.network || "") + "</span></button>").join("") +
        "</div></div>";
    });
    h += "</div>";
    h += '<p class="credit">Release dates from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>' + (DATA.updated ? ", updated " + esc(fmtDate(DATA.updated)) : "") + ".</p>";
    return h;
  }

  function viewShows() {
    const list = snapshotArray();
    const counts = { all: list.length, watching: 0, rewatching: 0, notstarted: 0, caughtup: 0, finished: 0, stopped: 0, favorites: 0 };
    list.forEach((s) => { counts[stateOf(s)]++; if (s.rw && stateOf(s) !== "rewatching") counts.rewatching++; if (s.favorite) counts.favorites++; });
    const keys = ["all", "watching", "rewatching", "notstarted", "caughtup", "finished", "stopped", "favorites"];
    const names = { all: "All", rewatching: "Rewatching", watching: "Watching", notstarted: "Not started", caughtup: "Caught up", finished: "Finished", stopped: "Stopped", favorites: "Favorites" };
    const match = (s) => ui.filter === "all" || (ui.filter === "favorites" ? s.favorite : ui.filter === "rewatching" ? !!s.rw : stateOf(s) === ui.filter);
    const shown = list.filter(match).sort((a, b) => sortTitle(a.title).localeCompare(sortTitle(b.title)));

    let h = '<div class="view-head"><div><h1 class="view-title">My shows</h1><p class="view-sub">' + plural(list.length, "show") + " on your list</p></div>" +
      '<button class="btn" data-action="go" data-tab="discover">' + ICON.plus + "Add shows</button></div>";
    if (!list.length) return h + '<div class="empty"><h3>Your shelf is empty</h3><p>Shows you add appear here as posters, with how far along you are in each.</p><button class="btn btn-primary" data-action="go" data-tab="discover">Browse shows</button></div>';
    h += '<div class="chips" role="group" aria-label="Filter">' + keys.filter((k) => k === "all" || counts[k]).map((k) =>
      '<button class="chip" data-action="filter" data-f="' + k + '" aria-pressed="' + (ui.filter === k) + '">' + names[k] + '<span class="n">' + counts[k] + "</span></button>").join("") + "</div>";
    if (!shown.length) return h + '<div class="empty"><p>No shows match this filter.</p></div>';
    h += '<div class="poster-grid">' + shown.map((s) => {
      const st = stateOf(s);
      return '<button class="tile" data-action="open" data-id="' + esc(s.id) + '"><div style="position:relative">' + poster(s, "md") + (s.favorite ? '<span class="tile-fav" aria-label="Favorite">★</span>' : "") + "</div>" +
        meter(s) + '<div class="tile-cap"><span class="tile-title">' + esc(s.title) + '</span><span class="tile-sub mono">' + watchedRegular(s) + "/" + airedRegular(s) + '</span><span class="pill ' + st + '">' + STATE_LABEL[st] + "</span></div></button>";
    }).join("") + "</div>";
    return h;
  }

  function viewDiscover() {
    const q = ui.query.trim().toLowerCase();
    const hit = (c) => !q || c.title.toLowerCase().includes(q) || (c.network || "").toLowerCase().includes(q) || c.genres.some((g) => g.toLowerCase().includes(q));
    const sorted = CATALOG.filter(hit).sort((a, b) => sortTitle(a.title).localeCompare(sortTitle(b.title)));
    const mine = sorted.filter((c) => onList(c.id)), avail = sorted.filter((c) => !onList(c.id));
    let h = '<div class="view-head"><div><h1 class="view-title">Add shows</h1><p class="view-sub">Pick from the list, look any show up, or enter one yourself.</p></div></div>';
    h += '<label class="search" for="q">' + ICON.search + '<input id="q" type="search" placeholder="Search shows, networks, genres" autocomplete="off" value="' + esc(ui.query) + '"></label>';

    if (avail.length) h += '<div class="stack"><div class="section-label">' + (q ? "Matches" : "With full episode guides") + ' <span class="count">' + avail.length + '</span></div><div class="result-list">' + avail.map((c) => resultRow(c, null)).join("") + "</div></div>";
    if (mine.length) h += '<div class="stack"><div class="section-label">Already on your list <span class="count">' + mine.length + '</span></div><div class="result-list">' + mine.map((c) => resultRow(c, onList(c.id))).join("") + "</div></div>";

    const L = ui.lookup;
    h += '<div class="panel"><div><h3>' + (q ? "Not the one you want?" : "Looking for something else?") + "</h3>";
    if (caps.sample) {
      h += "<p>Claude can fill in the network, runtime and episode counts for most series. Brand-new shows may need entering by hand.</p></div>";
      h += '<div class="row"><button class="btn btn-primary" data-action="lookup"' + (!q || (L && L.status === "loading") ? " disabled" : "") + ">" +
        (L && L.status === "loading" ? '<span class="spinner" aria-hidden="true"></span>Looking up “' + esc(L.q) + "”" : (q ? "Look up “" + esc(ui.query.trim()) + "”" : "Type a title above to look it up")) +
        '</button><button class="btn btn-ghost" data-action="manual">Enter it myself</button></div>';
      if (L && L.status === "done" && L.result) h += '<div class="result-list">' + resultRow(L.result, null, true) + '</div><p class="note">Details come from Claude and may be out of date. You can edit them on the show page anytime.</p>';
      else if (L && L.status === "notfound") h += '<p class="note">Claude couldn’t confidently identify “' + esc(L.q) + '”. It may be too new for Claude to know. Fill in the details below to add it.</p>';
      else if (L && L.status === "error") h += '<p class="note">' + esc(L.message) + "</p>";
    } else {
      h += "<p>Enter the title and how many episodes each season has.</p></div>";
      h += '<div class="row"><button class="btn btn-primary" data-action="manual">Enter a show</button></div>';
    }
    if (ui.manualOpen) h += manualForm();
    h += "</div>";
    h += '<p class="credit">Episode guides from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> (CC BY-SA)' + (DATA.updated ? ", updated " + esc(fmtDate(DATA.updated)) : "") + ".</p>";
    return h;
  }

  function resultRow(c, added, fromLookup) {
    const ns = (c.seasons || []).length;
    const meta = [c.network, years(c), plural(ns, "season"), totalEps(c) + " eps"].filter(Boolean).join(" · ");
    return '<div class="result">' + poster(Object.assign({ id: c.id || c.title }, c), "xs") + '<div><div class="t">' + esc(c.title) + '</div><div class="m">' + esc(meta) + "</div></div>" +
      (added ? '<button class="btn btn-sm" data-action="open" data-id="' + esc(added.id) + '">On your list</button>'
        : '<button class="btn btn-sm btn-primary" data-action="' + (fromLookup ? "add-lookup" : "add") + '" data-id="' + esc(c.id || "") + '">' + ICON.plus + "Add</button>") + "</div>";
  }

  function manualForm(s) {
    const v = s || { title: ui.query.trim(), network: "", runtime: 30, seasons: [10], status: "Returning", start: "", end: "" };
    const p = s ? "e-" : "m-";
    return '<form class="stack" id="' + (s ? "edit-form" : "manual-form") + '">' +
      '<div class="form-grid">' +
      '<div class="field wide"><label for="' + p + 'title">Title</label><input id="' + p + 'title" name="title" required maxlength="120" value="' + esc(v.title) + '"></div>' +
      '<div class="field"><label for="' + p + 'network">Network or service</label><input id="' + p + 'network" name="network" maxlength="40" value="' + esc(v.network || "") + '"></div>' +
      '<div class="field"><label for="' + p + 'runtime">Minutes per episode</label><input id="' + p + 'runtime" name="runtime" type="number" min="1" max="600" value="' + esc(v.runtime) + '"></div>' +
      '<div class="field wide"><label for="' + p + 'seasons">Episodes per season</label><input id="' + p + 'seasons" name="seasons" required inputmode="numeric" placeholder="8, 10, 10" value="' + esc((v.seasons || []).join(", ")) + '"><span class="hint">One number per season, separated by commas. Add a number when a new season starts.</span></div>' +
      '<div class="field"><label for="' + p + 'status">Status</label><select id="' + p + 'status" name="status">' + ["Returning", "Ended"].map((o) => "<option" + (v.status === o ? " selected" : "") + ">" + o + "</option>").join("") + "</select></div>" +
      '<div class="field"><label for="' + p + 'start">First aired</label><input id="' + p + 'start" name="start" type="number" min="1930" max="2100" placeholder="2022" value="' + esc(v.start || "") + '"></div>' +
      '<div class="field"><label for="' + p + 'end">Final year</label><input id="' + p + 'end" name="end" type="number" min="1930" max="2100" placeholder="Still airing" value="' + esc(v.end || "") + '"></div>' +

      '<div class="row"><button class="btn btn-primary" type="submit">' + (s ? "Save changes" : "Add show") + '</button><button class="btn btn-ghost" type="button" data-action="' + (s ? "cancel-edit" : "manual") + '">Cancel</button></div>' +
      "</form>";
  }

  function readForm(form) {
    const f = new FormData(form);
    const seasons = String(f.get("seasons") || "").split(/[^0-9]+/).map((n) => parseInt(n, 10)).filter((n) => n > 0 && n < 1000);
    return {
      title: String(f.get("title") || "").trim(), network: String(f.get("network") || "").trim(),
      runtime: parseInt(f.get("runtime"), 10) || 30, seasons: seasons,
      status: f.get("status") === "Ended" ? "Ended" : "Returning",
      start: parseInt(f.get("start"), 10) || null, end: parseInt(f.get("end"), 10) || null
    };
  }

  function viewStats() {
    const list = snapshotArray();
    const eps = list.reduce((a, s) => a + watchedCount(s), 0);
    const mins = list.reduce((a, s) => a + watchedMinutes(s), 0);
    const finished = list.filter((s) => stateOf(s) === "finished").length;
    const watching = list.filter((s) => stateOf(s) === "watching" || stateOf(s) === "rewatching").length;
    let rewatches = 0; list.forEach((s) => Object.keys(s.epx || {}).forEach((k) => { const r = s.epx[k].rw; if (Array.isArray(r)) rewatches += r.length; }));
    const d = Math.floor(mins / 1440), hr = Math.floor((mins % 1440) / 60), mn = mins % 60;

    let h = '<div class="view-head"><div><h1 class="view-title">Stats</h1><p class="view-sub">Everything you’ve marked watched, added up.</p></div></div>';
    h += '<div class="stat-grid">' +
      '<div class="stat"><span class="stat-num">' + d + "<small>d</small>" + hr + "<small>h</small>" + (d ? "" : mn + "<small>m</small>") + '</span><span class="stat-label">Time watching TV</span></div>' +
      '<div class="stat"><span class="stat-num">' + eps.toLocaleString() + '</span><span class="stat-label">Episodes watched' + (rewatches ? " · " + rewatches.toLocaleString() + " rewatched" : "") + "</span></div>" +
      '<div class="stat"><span class="stat-num">' + watching + '</span><span class="stat-label">Shows in progress</span></div>' +
      '<div class="stat"><span class="stat-num">' + finished + '</span><span class="stat-label">Shows finished</span></div></div>';

    const ranked = list.map((s) => ({ s: s, m: watchedMinutes(s) })).filter((x) => x.m > 0).sort((a, b) => b.m - a.m).slice(0, 10);
    h += '<div class="stack"><div class="section-label">Where your time went</div>';
    if (ranked.length) {
      const max = ranked[0].m;
      h += '<div class="panel time-bars">' + ranked.map((x) =>
        '<div class="tbar" style="' + tone(x.s) + '"><span class="n">' + esc(x.s.title) + '</span><span class="track"><i style="width:' + Math.max(2, (x.m / max) * 100) + '%"></i></span><span class="v">' + fmtDur(x.m) + "</span></div>").join("") + "</div>";
    } else {
      h += '<div class="empty"><p>Mark some episodes watched and your top shows by hours will show up here.</p></div>';
    }
    h += "</div>";

    const hist = [];
    list.forEach((s) => Object.keys(s.epx || {}).forEach((k) => {
      const x = s.epx[k], p = k.split("-").map(Number);
      if (x.at && isWatched(s, p[0], p[1])) hist.push({ s: s, season: p[0], ep: p[1], at: x.at, r: x.r });
      if (Array.isArray(x.rw)) x.rw.forEach((t) => hist.push({ s: s, season: p[0], ep: p[1], at: t, r: x.r, re: true }));
    }));
    hist.sort((a, b) => b.at - a.at);
    if (hist.length) {
      h += '<div class="stack"><div class="section-label">Recently watched</div><div class="panel history">' + hist.slice(0, 12).map((it) =>
        '<button class="hist-row" data-action="open-ep" data-id="' + esc(it.s.id) + '" data-s="' + it.season + '" data-e="' + it.ep + '">' + poster(it.s, "xs") +
          '<div><span class="t">' + esc(it.s.title) + '</span><span class="e">' + (it.re ? '<span class="tag rw">Rewatch</span>' : "") + shortCode(it.season, it.ep) + " · " + esc(epTitle(it.s, it.season, it.ep)) + (it.r ? ' <span class="ep-stars">' + stars(it.r) + "</span>" : "") + '</span></div><span class="d">' + esc(fmtDate(ymd(new Date(it.at)))) + "</span></button>").join("") + "</div></div>";
    }

    h += '<div class="stack"><div class="section-label">Your data</div><div class="panel">';
    h += '<div class="storage-line"><span class="dot' + (store.mode === "sync" && !waitingCount() ? " on" : "") + '"></span>' +
      (store.mode === "sync" ? (waitingCount() ? plural(waitingCount(), "change") + " waiting to save to your account. They’re kept on this device and retry on their own."
          : "Saved to your account. Sign in on any device to pick up where you left off.")
        : store.mode === "starting" ? "Connecting…" : "Saved in this browser only. Download a backup to keep it safe." +
          (waitingCount() && lsGet(LS_CACHE) ? " " + plural(waitingCount(), "change") + " will merge into your account the next time sync works." : "")) + "</div>";
    h += '<div class="row">' + (caps.downloads ? '<button class="btn" data-action="backup"' + (list.length ? "" : " disabled") + ">Download backup</button>" : "") +
      '<button class="btn" data-action="restore">Restore from backup</button></div></div>';
    const A = window.__hbAccount;

  // ---------- Sheet ----------
  function renderSheet() {
    const root = $("#sheet-root");
    const s = ui.openId && shows.get(ui.openId);
    if (!s) {
      if (root.innerHTML) { root.innerHTML = ""; document.body.style.overflow = ""; }
      return;
    }
    const sc0 = $(".sheet-scroll", root);
    const sameView = sc0 && sc0.dataset.view === viewKey();
    const prevScroll = sameView ? sc0.scrollTop : 0;
    const active = document.activeElement;
    const sel = active && root.contains(active) ? focusSelector(active) : null;
    const tvPrev = TV && active && root.contains(active) ? active.getBoundingClientRect() : null;
    const ta0 = $("#ep-note", root);
    const draft = ta0 && sameView ? ta0.value : null;
    const body = ui.epView ? episodeView(s) : showView(s);
    root.innerHTML = '<div class="sheet-wrap" data-action="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-scroll" data-view="' + esc(viewKey()) + '">' + body + "</div></div></div>";
    document.body.style.overflow = "hidden";
    const sc = $(".sheet-scroll", root);
    if (sc) sc.scrollTop = prevScroll;
    if (draft !== null) { const ta = $("#ep-note", root); if (ta) ta.value = draft; }

    tvEnsureFocus(tvPrev);
  }
  function viewKey() { return ui.openId + (ui.epView ? ":" + key(ui.epView.s, ui.epView.e) : ""); }

  function seasonSection(s, sn, cnt, q) {
    const open = ui.expanded.has(sn), special = sn === 0, skipped = !special && seasonSkipped(s, sn);
    let done = 0, out = 0, rwd = 0, rwt = 0;
    for (let e = 1; e <= cnt; e++) {
      if (isWatched(s, sn, e)) done++;
      if (aired(s, sn, e)) out++;
      if (!special && rwEligible(s, sn, e)) { rwt++; if (rwDone(s, sn, e)) rwd++; }
    }
    const name = special ? "Specials" : "Season " + sn;
    const hasTitles = hasGuide(s) || (s.titles && s.titles[sn] && s.titles[sn].length);
    const busyT = ui.busy["titles:" + s.id + ":" + sn];
    let h = '<section class="season' + (skipped ? " skipped" : "") + '" data-open="' + open + '"><div class="season-head">' +
      '<button class="season-toggle" data-action="season-toggle" data-s="' + sn + '" aria-expanded="' + open + '">' + ICON.chev + '<h3 class="season-name">' + name + "</h3>" +
      (skipped ? '<span class="tag">Skipped</span>' : '<span class="season-count">' + done + "/" + cnt + (out < cnt ? " · " + (cnt - out) + " to come" : "") + "</span>" +
        (s.rw && rwt ? '<span class="season-count" style="color:var(--accent)">↻ ' + rwd + "/" + rwt + "</span>" : "") +
        '<span class="season-bar"><i style="width:' + (cnt ? Math.round(done / cnt * 100) : 0) + '%"></i></span>') +
      "</button></div>";
    if (open) {
      h += '<div class="season-actions">';
      if (skipped) h += '<button class="btn btn-sm" data-action="season-skip" data-s="' + sn + '" data-on="0">Unskip season</button>';
      else {
        if (s.rw && rwt && !special) h += '<button class="btn btn-sm ' + (rwd >= rwt ? "btn-ghost" : "") + '" data-action="season-rw" data-s="' + sn + '">' + (rwd >= rwt ? "Unmark rewatch" : "Mark season rewatched") + "</button>";
        if (out) h += '<button class="btn btn-sm ' + (done >= out ? "btn-ghost" : "") + '" data-action="season" data-s="' + sn + '">' + (done >= out ? "Unmark " + (special ? "all" : "season") : (out < cnt ? "Mark aired watched" : "Mark " + (special ? "all" : "season") + " watched")) + "</button>";
        if (!special) h += '<button class="btn btn-sm btn-ghost" data-action="season-skip" data-s="' + sn + '" data-on="1">Skip season</button>';
        if (!hasTitles && caps.sample && !special) h += '<button class="btn btn-sm btn-ghost" data-action="titles" data-s="' + sn + '"' + (busyT ? " disabled" : "") + ">" + (busyT ? '<span class="spinner"></span>Getting titles' : "Get episode titles") + "</button>";
      }
      h += "</div>";
      if (!skipped) {
        h += '<div class="ep-list">';
        for (let e = 1; e <= cnt; e++) {
          const info = epInfo(s, sn, e), on = isWatched(s, sn, e), isAired = aired(s, sn, e), x = epx(s, sn, e), sk = isSkipped(s, sn, e);
          const isNext = q && q.season === sn && q.ep === e, rc = rwCount(s, sn, e);
          const rwMode = !!s.rw && on && !special;
          const pressed = rwMode ? rwDone(s, sn, e) : on;
          h += '<div class="ep-row' + (isNext ? " is-next" : "") + (isAired ? "" : " unaired") + (sk ? " skipped" : "") + '">' +
            '<button class="check-btn sm' + (rwMode ? " rw" : "") + '" data-action="ep" data-s="' + sn + '" data-e="' + e + '" aria-pressed="' + pressed + '"' + (isAired ? "" : " disabled") + ' aria-label="' + (isAired ? (rwMode ? (pressed ? "Unmark rewatch of " : "Mark rewatched ") : (on ? "Unmark " : "Mark watched ")) + esc(code(sn, e)) : "Not released yet") + '">' + ICON.check + "</button>" +
            '<button class="ep-open" data-action="open-ep" data-id="' + esc(s.id) + '" data-s="' + sn + '" data-e="' + e + '"><span class="ep-code">' + (special ? "SP" : "E") + pad(e) + '</span><span class="ep-title">' + (sk ? '<span class="tag">Skipped</span>' : "") + esc(epTitle(s, sn, e)) + (x.r ? ' <span class="ep-stars">' + stars(x.r) + "</span>" : "") + (rc ? ' <span class="rw-badge" title="Rewatched ' + plural(rc, "time") + '">↻' + (rc > 1 ? rc : "") + "</span>" : "") + "</span>" +
            '<span class="ep-date">' + (info.date ? (isAired ? esc(fmtDate(info.date)) : "Out " + esc(fmtDate(info.date))) : "") + "</span></button></div>";
        }
        h += "</div>";
      }
    }
    return h + "</section>";
  }

  function showView(s) {
    const t = airedRegular(s), w = watchedRegular(s), st = stateOf(s), q = queueNext(s), sk = skippedCount(s);
    const meta = [s.network, years(s), s.status].filter(Boolean).join(" · ");
    const f = firstUnwatched(s);
    let h = '<div class="sheet-top"><button class="close-btn" data-action="close" aria-label="Close">' + ICON.close + "</button>" +
      '<div class="sheet-head">' + poster(s, "lg") + '<div class="head-text"><span class="pill ' + st + '">' + STATE_LABEL[st] + "</span>" +
      '<h2 class="sheet-title" id="sheet-title">' + esc(s.title) + "</h2>" +
      '<div class="sheet-meta">' + esc(meta) + "</div>" +
      (q && !s.stopped ? '<div class="row"><button class="btn btn-primary btn-sm" data-action="mark-next" data-id="' + esc(s.id) + '">' + ICON.check + (q.rewatch ? "Rewatched " : "Watched ") + shortCode(q.season, q.ep) + "</button></div>"
        : (f && !q ? '<div class="sheet-meta">Next: ' + shortCode(f.season, f.ep) + (epInfo(s, f.season, f.ep).date ? " on " + esc(fmtDate(epInfo(s, f.season, f.ep).date, true)) : "") + "</div>" : "")) +
      "</div></div></div>";

    h += '<div class="stack" style="gap:6px">' + meter(s) + '<div class="progress-line"><span><b class="mono">' + w + " / " + t + "</b> episodes out" + (totalEps(s) - t - sk > 0 ? " · " + (totalEps(s) - t - sk) + " coming" : "") + (sk ? " · " + sk + " skipped" : "") + (s.specials ? " · " + plural(s.specials, "special") : "") + "</span><span>" + fmtDur(watchedMinutes(s)) + " watched · " + fmtDur(leftMinutes(s)) + " left</span></div></div>";

    if (s.rw) {
      const pr = rwProgress(s);
      h += '<div class="rewatch-bar"><span>Rewatch' + ((s.rewatches || 0) ? " #" + ((s.rewatches || 0) + 1) : "") + " in progress · " + pr.done + " of " + pr.total + ' episodes</span><button class="btn btn-sm btn-ghost" data-action="rewatch-stop">Stop rewatch</button></div>';
    } else if (s.rewatches) {
      h += '<p class="note">You’ve rewatched this show ' + (s.rewatches === 1 ? "once" : s.rewatches + " times") + ".</p>";
    }

    h += '<div class="row">' +
      (s.seasons.length > 1 ? '<button class="btn btn-sm" data-action="start-from">Start from season…</button>' : "") +
      (w && !s.rw ? '<button class="btn btn-sm" data-action="rewatch-start">↻ Rewatch from the start</button>' : "") +
      '<button class="btn btn-sm" data-action="fav" aria-pressed="' + !!s.favorite + '">' + (s.favorite ? "★ Favorite" : "☆ Favorite") + "</button>" +
      '<button class="btn btn-sm" data-action="stop">' + (s.stopped ? "Resume watching" : "Stop watching") + "</button>" +
      (caps.assets ? '<button class="btn btn-sm" data-action="photo"' + (ui.busy["photo:" + s.id] ? " disabled" : "") + ">" + (ui.busy["photo:" + s.id] ? '<span class="spinner"></span>Uploading' : (s.photo ? "Change photo" : "Add photo")) + "</button>" : "") +
      (s.photo ? '<button class="btn btn-sm btn-ghost" data-action="photo-remove">Remove photo</button>' : "") +
      '<button class="btn btn-sm" data-action="edit">Edit details</button>' +
      '<button class="btn btn-sm btn-ghost btn-danger" data-action="remove">Remove</button></div>';

    if (ui.startFrom) {
      const firstKept = s.seasons.findIndex((c, i) => !seasonSkipped(s, i + 1)) + 1 || 1;
      h += '<div class="confirm"><label for="start-season">Skip everything before <select class="inline" id="start-season">' + s.seasons.map((c, i) => '<option value="' + (i + 1) + '"' + (i + 1 === firstKept ? " selected" : "") + ">Season " + (i + 1) + "</option>").join("") + '</select></label><span class="note">Skipped seasons don’t count as watched; they just stop showing up in Up next.</span><button class="btn btn-sm btn-primary" data-action="start-from-yes">Apply</button><button class="btn btn-sm btn-ghost" data-action="start-from-no">Cancel</button></div>';
    }
    if (ui.confirmRemove) h += '<div class="confirm"><span>Remove ' + esc(s.title) + " and its " + plural(watchedCount(s), "watched episode") + '?</span><button class="btn btn-sm btn-primary" data-action="remove-yes">Remove</button><button class="btn btn-sm btn-ghost" data-action="remove-no">Keep it</button></div>';
    if (ui.editing) h += '<div class="panel">' + manualForm(s) + "</div>";
    if (!s.seasons.length) h += '<div class="empty"><p>No episodes yet. Use Edit details to add seasons.</p></div>';

    h += '<div class="stack" style="gap:10px">';

        let j = i; while (j + 1 < s.seasons.length && seasonSkipped(s, j + 2)) j++;

          if (open) {

              '<div class="ep-list">' + s.seasons.slice(i, j + 1).map((cnt, k) => '<div class="ep-row skipped"><button class="btn btn-sm btn-ghost" data-action="season-skip" data-s="' + (i + k + 1) + '" data-on="0">Unskip</button><span class="ep-title">Season ' + (i + k + 1) + " · " + plural(cnt, "episode") + "</span></div>").join("") + "</div>";

    if (hasGuide(s)) h += '<p class="credit">Episode guide from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> (CC BY-SA).</p>';

  }
  function fillBar(s) {

  }

  function neighbor(s, sn, e, dir) {
    if (sn === 0) { const n = e + dir; return n >= 1 && n <= (s.specials || 0) ? { s: 0, e: n } : null; }
    if (dir > 0) { if (e < s.seasons[sn - 1]) return { s: sn, e: e + 1 }; if (sn < s.seasons.length) return { s: sn + 1, e: 1 }; return null; }
    if (e > 1) return { s: sn, e: e - 1 }; if (sn > 1) return { s: sn - 1, e: s.seasons[sn - 2] }; return null;
  }

  function episodeView(s) {
    const sn = ui.epView.s, e = ui.epView.e;
    const cnt = sn === 0 ? (s.specials || 0) : s.seasons[sn - 1];
    if (!cnt || e > cnt) { ui.epView = null; return showView(s); }
    const info = epInfo(s, sn, e), on = isWatched(s, sn, e), isAired = aired(s, sn, e), x = epx(s, sn, e), sk = isSkipped(s, sn, e);
    const k = key(sn, e), busy = ui.busy["sum:" + s.id + ":" + k];
    const prev = neighbor(s, sn, e, -1), next = neighbor(s, sn, e, 1);
    const rwMode = !!s.rw && on && sn > 0, rwd = rwDone(s, sn, e), rc = rwCount(s, sn, e);
    const metaParts = [];
    if (info.date) metaParts.push((isAired ? "Aired " : "Releases ") + fmtDate(info.date, true));
    if (info.date && !isAired) { const n = daysUntil(info.date); metaParts.push(n === 1 ? "tomorrow" : "in " + plural(n, "day")); }
    metaParts.push(info.rt + " min");

    let h = '<div class="ep-view"><div class="sheet-top"><button class="close-btn" data-action="close" aria-label="Close">' + ICON.close + "</button>" +
      '<button class="back-btn" data-action="ep-back">' + ICON.back + esc(s.title) + "</button></div>";
    h += '<div class="ep-hero"><span class="code">' + code(sn, e) + '</span><h2 id="sheet-title">' + esc(epTitle(s, sn, e)) + '</h2><span class="meta">' + esc(metaParts.join(" · ")) + "</span></div>";

    if (isAired) {
      if (rwMode) {
        h += '<div class="watch-box"><button class="check-btn rw" data-action="ep" data-s="' + sn + '" data-e="' + e + '" aria-pressed="' + rwd + '" aria-label="' + (rwd ? "Unmark rewatch" : "Mark rewatched") + '">' + ICON.check + "</button>" +
          '<div class="info"><b>' + (rwd ? "Rewatched" : "Up for rewatch") + "</b><span>" + (rwd ? "In this rewatch" + (rc ? ", on " + esc(fmtDate(ymd(new Date(x.rw[rc - 1])), true)) : "") : "First watched " + (x.at ? esc(fmtDate(ymd(new Date(x.at)), true)) : "earlier")) + "</span></div></div>";
      } else {
        h += '<div class="watch-box"><button class="check-btn" data-action="ep" data-s="' + sn + '" data-e="' + e + '" aria-pressed="' + on + '" aria-label="' + (on ? "Unmark" : "Mark watched") + '">' + ICON.check + "</button>" +
          '<div class="info"><b>' + (on ? "Watched" : sk ? "Skipped" : "Not watched yet") + "</b><span>" + (on ? (x.at ? "On " + esc(fmtDate(ymd(new Date(x.at)), true)) : "Date not recorded") : sk ? "It won’t show in Up next. Tap the check if you do watch it." : "Tap the check when you’ve seen it") + "</span></div>" +
          (on ? '<label class="label" for="watched-on" style="display:grid;gap:4px">Watched on<input type="date" id="watched-on" max="' + today() + '" value="' + (x.at ? ymd(new Date(x.at)) : "") + '"></label>' : (sn > 0 ? '<button class="btn btn-sm" data-action="skip-ep" data-on="' + (sk ? 0 : 1) + '">' + (sk ? "Unskip" : "Skip this one") + "</button>" : ""));
        if (on) {
          h += '<div class="watch-line"><span style="flex:1;min-width:160px">' + (rc ? "<b>Rewatched " + (rc === 1 ? "once" : rc + " times") + "</b> · last on " + esc(fmtDate(ymd(new Date(x.rw[rc - 1])), true)) : "Seen it again?") + "</span>" +
            '<button class="btn btn-sm" data-action="rewatch-ep">↻ Watched again</button>' +
            (rc ? '<button class="btn btn-sm btn-ghost" data-action="rewatch-undo">Remove last rewatch</button>' : "") + "</div>";
        }
        h += "</div>";
      }

        h += '<button class="next-up" data-action="ep-go" data-s="' + q.season + '" data-e="' + q.ep + '"><span class="lbl">' + (q.rewatch ? "Next to rewatch" : "Up next") + '</span><span class="what"><b>' + shortCode(q.season, q.ep) + "</b><span>" + esc(epTitle(s, q.season, q.ep)) + "</span></span>" + ICON.fwd + "</button>";
      }
    } else {
      h += '<div class="watch-box"><div class="info"><b>Not out yet</b><span>You can mark it watched once it’s released' + (info.date ? " on " + esc(fmtDate(info.date, true)) : "") + ".</span></div></div>";
    }

    if (isAired) {
      h += '<div class="stack" style="gap:6px"><span class="label">Your rating</span><div class="stars" role="group" aria-label="Your rating">';
      for (let i = 1; i <= 5; i++) h += '<button class="star" data-action="rate" data-r="' + i + '" aria-pressed="' + ((x.r || 0) >= i) + '" aria-label="' + plural(i, "star") + '">★</button>';

    else if (hasGuide(s) && DATA.synState === "loading") h += '<p class="note"><span class="spinner" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>Loading…</p>';
    else if (x.sum) h += '<p class="summary">' + esc(x.sum) + '</p><span class="from">Summary by Claude, kept spoiler-light. It may contain mistakes.</span>';
    else if (!isAired) h += '<p class="note">No summary until it airs.</p>';
    else if (caps.sample) {
      h += '<div class="row"><button class="btn btn-sm" data-action="summary"' + (busy ? " disabled" : "") + ">" + (busy ? '<span class="spinner"></span>Writing summary' : "Get a spoiler-light summary") + "</button></div>";
      if (ui.busy["sumerr:" + s.id + ":" + k]) h += '<p class="note">' + esc(ui.busy["sumerr:" + s.id + ":" + k]) + "</p>";

    h += "</div>";

    h += '<div class="field"><label for="ep-note">Your notes</label><textarea id="ep-note" maxlength="2000" placeholder="Thoughts, favorite moments, theories">' + esc(x.n || "") + '</textarea><div class="row"><button class="btn btn-sm" data-action="save-note">Save note</button></div></div>';

    h += '<div class="ep-nav">' +
      (prev ? '<button class="btn btn-sm btn-ghost" data-action="ep-go" data-s="' + prev.s + '" data-e="' + prev.e + '">' + ICON.back + shortCode(prev.s, prev.e) + "</button>" : "<span></span>") +
      (next ? '<button class="btn btn-sm btn-ghost" data-action="ep-go" data-s="' + next.s + '" data-e="' + next.e + '">' + shortCode(next.s, next.e) + ICON.fwd + "</button>" : "<span></span>") +
      "</div>";
    h += fillBar(s);
    return h + "</div>";
  }

  function openShow(id, ep) {
    const s = shows.get(id); if (!s) return;
    if (TV && !ui.openId) tvReturn = { sel: focusSelector(document.activeElement), id: id };

  }
  function closeShow() {
    saveNoteIfChanged();
    const back = tvReturn; tvReturn = null;
    ui.openId = null; ui.epView = null; ui.fill = null; ui.editing = false; ui.confirmRemove = false; ui.startFrom = false; render();
    if (TV && back) {
      let el = null;
      try { el = (back.sel && $("#view " + back.sel)) || $('#view [data-id="' + String(back.id).replace(/"/g, "") + '"]'); } catch (e) {}

  // back from an episode to its show: land on that episode's row
  function leaveEpisode() {

    saveNoteIfChanged(); ui.fill = null; ui.expanded.add(v.s); ui.epView = null; renderSheet();
    if (TV) { const row = $('.sheet .ep-open[data-s="' + v.s + '"][data-e="' + v.e + '"]'); if (row) tvFocus(row); }
  }
  function gotoEpisode(sn, e) {

    const sc = $(".sheet-scroll"); if (sc) sc.scrollTop = 0;
  }

  function saveNoteIfChanged() {

    if (!ta || !s || !ui.epView) return;
    const val = ta.value.trim(), cur = epx(s, ui.epView.s, ui.epView.e).n || "";
    if (val !== cur) { const v = ui.epView; commit(s.id, (c) => { setEpx(c, v.s, v.e, { n: val || null }); return c; }); }
  }

  // ---------- Claude calls ----------
  async function lookup() {
    const q = ui.query.trim();
    if (!q || !caps.sample) return;
    ui.lookup = { status: "loading", q: q };
    render();
    const prompt = "You help a TV tracking app identify a TV series. Today is " + new Date().toDateString() + ".\n" +
      "The user typed: " + JSON.stringify(q) + "\n" +
      "Identify the single most likely TV series. Reply with ONLY a JSON object, no prose, in this shape:\n" +
      '{"found": true, "title": "Official title", "network": "Original network or streaming service", "start": 2019, "end": 2023 or null if still running, "status": "Ended" or "Returning", "runtime": typical episode length in minutes, "genres": ["Drama"], "seasons": [episode count of season 1, season 2, ...]}\n' +
      "Include seasons that have premiered, plus a season that is announced with a known episode count. For a season currently airing, use its full episode count. If you can't identify a real series with confidence, reply {\"found\": false}.";

      const seasons = r && Array.isArray(r.seasons) ? r.seasons.map((n) => parseInt(n, 10)).filter((n) => n > 0 && n < 1000) : [];

        id: existing ? existing.id : "", title: String(r.title).slice(0, 120), network: String(r.network || "").slice(0, 40),

    render();
  }

  async function getSummary(s, sn, e) {
    if (!caps.sample) return;
    const k = key(sn, e), bk = "sum:" + s.id + ":" + k, ek = "sumerr:" + s.id + ":" + k;
    ui.busy[bk] = true; delete ui.busy[ek]; renderSheet();
    const info = epInfo(s, sn, e);
    const prompt = "Write a spoiler-light summary of one TV episode for someone deciding whether to watch it.\n" +
      "Series: " + s.title + (s.network ? " (" + s.network + ")" : "") + (s.start ? ", first aired " + s.start : "") + "\n" +
      "Episode: " + (sn === 0 ? "special" : "season " + sn + ", episode " + e) + (info.title ? ", titled " + JSON.stringify(info.title) : "") + (info.date ? ", aired " + info.date : "") + "\n" +
      "Give 2 to 3 sentences on the setup and what the episode is about. Do not reveal twists, deaths, or the ending.\n" +
      'Reply with ONLY JSON: {"known": true, "summary": "..."}. If you do not know this specific episode well, reply {"known": false}. Never guess.';
    try {
      const r = await caps.sample.json(prompt, { modelTier: "default" });
      if (r && r.known && r.summary) commit(s.id, (c) => { setEpx(c, sn, e, { sum: String(r.summary).slice(0, 900) }); return c; });

  }

      'Reply with ONLY JSON: {"known": true, "titles": ["title of episode 1", ...]} in episode order. If you are not confident of the titles, reply {"known": false}. Never invent titles.';

  // ---------- Photos ----------
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const max = 900, scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.86));
    if (!blob) throw new Error("encode");
    return blob;
  }
  async function uploadPhoto(file) {
    const id = ui.openId, s = shows.get(id);
    if (!s || !caps.assets || !file) return;
    const heic = /hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "");
    if (!/^image\//.test(file.type) && !heic) { toast("Choose an image file."); return; }
    ui.busy["photo:" + id] = true; renderSheet();
    try {
      let blob;
      try { blob = await shrink(file); }
      catch (e) {
        if (heic || !/^image\/(jpeg|png|webp|gif)$/.test(file.type)) throw new Error("format");
        blob = file;
      }
      const res = await caps.assets.upload(blob);
      const old = s.photo && s.photo.id;
      commit(id, (c) => { c.photo = { id: res.id, url: res.url }; return c; }, "Photo added");
      if (old && caps.assets.delete) caps.assets.delete(old).catch(() => {});
    } catch (e) {
      if (e && e.message === "format") toast("This browser can’t read that photo format (often HEIC from an iPhone). Choose a JPEG or PNG.");
      else toast(e && e.code === "quota_exceeded" ? "Photo storage is full. Remove a photo and try again." : "The photo didn’t upload. Try a smaller image.");
    }
    delete ui.busy["photo:" + id];
    render();
  }

  // ---------- TV remote ----------
  // Arrows move focus to the nearest control in that direction, Select presses it (buttons already respond to Enter),
  // and Back arrives as Escape: it closes what's open, then returns to Up next, then asks the TV app to close.
  const TV_SEL = 'button:not([disabled]), input:not([type="hidden"]):not([type="file"]), select, textarea';
  function tvItems() {
    const sheet = $(".sheet");
    const list = [...(sheet || document).querySelectorAll(TV_SEL)];
    const undo = $("#undo-btn"); if (undo && list.indexOf(undo) === -1) list.push(undo);
    return list.filter((el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
  }
  function tvFocus(el) {
    if (!el) return;
    el.focus({ preventScroll: true });

    if (!$(".sheet") && el.getBoundingClientRect().top + window.scrollY < window.innerHeight * 0.55) window.scrollTo(0, 0);
  }
  function tvDefault(items) {
    const sheet = $(".sheet");
    if (sheet) return $(".watch-box .check-btn:not([disabled])", sheet) || $(".sheet-head .btn-primary", sheet) || $(".close-btn", sheet) || items[0];
    const v = $("#view");
    return items.find((el) => v.contains(el) && el.id !== "q") || $('.tab[aria-current="page"]') || items[0];
  }
  // after a re-render drops focus (a card moved, a show was added), focus whatever now sits closest to where it was
  function tvEnsureFocus(prev) {
    if (!TV) return;
    const a = document.activeElement, sheet = $(".sheet");
    if (a && a !== document.body && document.contains(a) && (!sheet || sheet.contains(a) || a.id === "undo-btn")) return;
    const items = tvItems(); if (!items.length) return;
    let pick = null;
    if (prev && prev.width) {
      const px = (prev.left + prev.right) / 2, py = (prev.top + prev.bottom) / 2;
      let bd = Infinity;
      items.forEach((el) => {
        const r = el.getBoundingClientRect();
        const d = Math.hypot((r.left + r.right) / 2 - px, ((r.top + r.bottom) / 2 - py) * 1.5);
        if (d < bd) { bd = d; pick = el; }
      });
    }
    tvFocus(pick || tvDefault(items));
  }
  function tvMove(dir) {
    const items = tvItems(); if (!items.length) return;
    const cur = document.activeElement;
    if (!cur || items.indexOf(cur) === -1) { tvFocus(tvDefault(items)); return; }
    const a = cur.getBoundingClientRect(), acx = (a.left + a.right) / 2, acy = (a.top + a.bottom) / 2;
    const vert = dir === "up" || dir === "down";
    let best = null, bestScore = Infinity;
    items.forEach((el) => {
      if (el === cur) return;
      const b = el.getBoundingClientRect();
      // distance along the direction of travel; candidates must lie beyond the current control
      const main = dir === "down" ? b.top - a.bottom : dir === "up" ? a.top - b.bottom : dir === "right" ? b.left - a.right : a.left - b.right;
      const beyond = dir === "down" ? b.top > a.top : dir === "up" ? b.bottom < a.bottom : dir === "right" ? b.left > a.left : b.right < a.right;
      if (main < -4 || !beyond) return;
      // sideways: zero when the two overlap, so controls in the same column or row win
      const gap = vert ? Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right)) : Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom));
      const off = vert ? Math.abs((b.left + b.right) / 2 - acx) : Math.abs((b.top + b.bottom) / 2 - acy);
      const score = Math.max(0, main) + gap * 3 + off * 0.25;
      if (score < bestScore) { bestScore = score; best = el; }
    });
