# Every morning, bring Up Next's episode guide up to date from TVmaze (tools/refresh_episodes.py), commit it when
# something changed, and republish the site. Runs on GitHub's servers; no keys needed.
name: Refresh episodes
on:
  schedule:
    - cron: "17 10 * * *"   # 4:17 AM Central (5:17 in summer)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh.yml", "tools/refresh_episodes.py"]
permissions:
  contents: write
  pages: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull new episodes from TVmaze
        run: python3 tools/refresh_episodes.py
      - name: Commit and republish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- episodes.json synopses.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json synopses.json
          git commit -m "Episode guide refresh $(date -u +%F)"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages will pick it up on its own."
